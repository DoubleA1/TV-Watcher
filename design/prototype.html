<title>TV-Watcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* ===========================================================================
   TV-Watcher — interactive mirror of the built application.

   This is a static stand-in for the real Next.js app, kept in step with it so
   the three pages can be clicked through without a deployment. Cover art is
   generated here exactly as it is in the app: a duotone ground, one of six
   geometric motifs, all derived from a hash of the title.

   Deliberately single-theme. A console has one look; it does not follow the
   reader's OS preference. Every colour is painted explicitly so the page
   holds on any host ground.
   ========================================================================= */

:root {
  --void:      #05070d;
  --panel:     #0b111d;
  --panel-2:   #111a2b;
  --panel-3:   #18233a;
  --line:      #1c2740;
  --line-lit:  #2b3b5c;

  --ink:       #e9eefa;
  --ink-dim:   #95a6c0;
  --ink-faint: #5d6c85;

  /* Teal = tracked, armed, primary action. */
  --signal:      #45e0d0;
  --signal-deep: #0c6d69;
  --signal-glow: rgba(69, 224, 208, 0.13);
  /* Amber is semantic, never decorative: the thing has actually dropped. */
  --live:        #ffb340;
  --live-glow:   rgba(255, 179, 64, 0.13);

  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:    "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --mono:    "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --radius: 4px;
  --gutter: clamp(16px, 4vw, 40px);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--void);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

#stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  background-image:
    linear-gradient(to right, rgba(69, 224, 208, 0.028) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(69, 224, 208, 0.028) 1px, transparent 1px);
  background-size: 76px 76px;
  -webkit-mask-image: radial-gradient(ellipse 130% 85% at 50% 0%, #000 15%, transparent 72%);
          mask-image: radial-gradient(ellipse 130% 85% at 50% 0%, #000 15%, transparent 72%);
  pointer-events: none;
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse 95% 50% at 50% -10%, rgba(69, 224, 208, 0.15), transparent 62%),
    radial-gradient(ellipse 55% 40% at 88% 4%, rgba(255, 179, 64, 0.05), transparent 68%);
  pointer-events: none;
}

.shell { position: relative; z-index: 1; }

h1, h2, h3 {
  font-family: var(--display);
  font-variation-settings: "wdth" 118;
  font-weight: 700;
  letter-spacing: -0.005em;
  text-wrap: balance;
  margin: 0;
  line-height: 1.12;
}

.readout {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.17em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-weight: 500;
}

/* --------------------------------------------------------------- chrome -- */

.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: rgba(5, 7, 13, 0.92);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}

.topbar-in {
  max-width: 1180px;
  margin: 0 auto;
  padding-inline: var(--gutter);
  padding-block: 11px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.mark {
  display: flex;
  align-items: center;
  gap: 9px;
  font-family: var(--display);
  font-variation-settings: "wdth" 112;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  white-space: nowrap;
}

.mark-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--signal);
  box-shadow: 0 0 0 3px var(--signal-glow);
  flex: none;
}

.flag {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--live);
  border: 1px solid rgba(255, 179, 64, 0.32);
  background: var(--live-glow);
  border-radius: var(--radius);
  padding: 4px 9px;
  white-space: nowrap;
}

nav.tabs { display: flex; gap: 3px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }

.tab {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink-faint);
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius);
  padding: 6px 11px;
  cursor: pointer;
  white-space: nowrap;
  transition: color .16s, border-color .16s, background .16s;
}
.tab:hover { color: var(--ink-dim); border-color: var(--line); }
.tab[aria-selected="true"] { color: var(--signal); border-color: var(--signal-deep); background: var(--signal-glow); }

main { max-width: 1180px; margin: 0 auto; padding-inline: var(--gutter); padding-block: 0 90px; }

/* ------------------------------------------------------------------ hero -- */

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
  gap: clamp(28px, 5vw, 60px);
  align-items: center;
  padding-block: clamp(20px, 4vw, 44px);
}

.hero h1 {
  font-size: clamp(2.1rem, 5.6vw, 3.7rem);
  font-variation-settings: "wdth" 122;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.hero h1 em { font-style: normal; color: var(--signal); }
.hero-sub { color: var(--ink-dim); font-size: clamp(1rem, 1.6vw, 1.1rem); max-width: 46ch; margin-top: 20px; }
.hero-cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }

.btn {
  font-family: var(--body);
  font-size: 14px;
  font-weight: 600;
  border-radius: var(--radius);
  padding: 11px 20px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background .16s, border-color .16s, color .16s;
}
.btn-primary { background: var(--signal); color: #04120f; border-color: var(--signal); }
.btn-primary:hover { background: #63ecdd; border-color: #63ecdd; }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line-lit); }
.btn-ghost:hover { border-color: var(--signal-deep); color: var(--signal); }

.counter {
  border: 1px solid var(--line);
  border-radius: 6px;
  background: linear-gradient(180deg, rgba(69,224,208,0.055), transparent 58%), var(--panel);
  padding: 20px;
}
.counter-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-bottom: 13px; border-bottom: 1px solid var(--line); margin-bottom: 16px;
}
.pulse {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.15em;
  text-transform: uppercase; color: var(--signal);
}
.pulse i { width: 6px; height: 6px; border-radius: 50%; background: var(--signal); animation: blip 2.3s ease-in-out infinite; }
@keyframes blip { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

.counter-title { font-family: var(--display); font-variation-settings: "wdth" 115; font-weight: 700; font-size: 1.3rem; }
.counter-meta { color: var(--ink-dim); font-size: 13px; }

.clock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
.clock-cell { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 6px 9px; text-align: center; }
.clock-val { font-family: var(--mono); font-size: clamp(1.4rem, 4vw, 1.8rem); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.clock-lab { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-faint); margin-top: 7px; }
.counter-foot { margin-top: 15px; padding-top: 13px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-dim); display: flex; align-items: center; gap: 8px; }
.counter-foot svg { flex: none; color: var(--signal); }

/* ----------------------------------------------------------------- search -- */

.search-wrap { position: relative; max-width: 620px; margin: 22px auto 0; }
.search-wrap svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); pointer-events: none; }
.search-wrap input { padding-left: 38px; }

input[type="text"], input[type="email"], input[type="password"], input[type="tel"], input[type="search"] {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--ink);
  font-family: var(--body);
  font-size: 14px;
  padding: 11px 13px;
  transition: border-color .16s, box-shadow .16s;
}
input::placeholder { color: var(--ink-faint); }
input:focus { outline: none; border-color: var(--signal-deep); box-shadow: 0 0 0 3px var(--signal-glow); }

/* ----------------------------------------------------------------- rails -- */

.sec { margin-top: clamp(30px, 4vw, 46px); }
.sec-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 14px; flex-wrap: wrap; margin-bottom: 12px; padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.sec-head h2 { font-size: 1.12rem; font-variation-settings: "wdth" 114; }
.sec-note { color: var(--ink-faint); font-size: 12px; }

.rail {
  display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px;
  margin-inline: calc(var(--gutter) * -1); padding-inline: var(--gutter);
  scroll-snap-type: x proximity; scrollbar-width: thin;
}
.rail > * { flex: none; scroll-snap-align: start; }

.grid-titles { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 14px; }

.plate { text-align: left; background: none; border: 0; padding: 0; cursor: pointer; width: 132px; }
.plate.lg { width: 168px; }
.plate-art {
  position: relative; aspect-ratio: 2/3; max-width: 100%;
  border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden;
  transition: border-color .18s, transform .18s;
}
.plate:hover .plate-art { border-color: var(--line-lit); transform: translateY(-2px); }
.plate:focus-visible .plate-art { outline: 2px solid var(--signal); outline-offset: 2px; }
.plate-art svg { display: block; width: 100%; height: 100%; }
.plate-tag {
  position: absolute; left: 7px; top: 7px; z-index: 2;
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 3px 6px; border-radius: 3px; background: rgba(5,7,13,0.85);
  border: 1px solid var(--line-lit); color: var(--ink-dim);
}
.plate-tag.live { color: var(--live); border-color: rgba(255,179,64,0.4); }
.plate-name { font-size: 13px; font-weight: 500; margin-top: 9px; line-height: 1.34; }
.plate-sub { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); margin-top: 3px; }

/* --------------------------------------------------------------- panels -- */

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.pad { padding: clamp(18px, 3vw, 28px); }

.signals { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.signal { background: var(--panel); padding: 20px; display: flex; flex-direction: column; gap: 9px; }
.signal svg { color: var(--signal); width: 22px; height: 22px; }
.signal h3 { font-size: .97rem; font-variation-settings: "wdth" 112; font-weight: 600; }
.signal p { margin: 0; color: var(--ink-dim); font-size: 13px; line-height: 1.55; }
.signal-flag {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.13em; text-transform: uppercase;
  color: var(--ink-faint); border: 1px solid var(--line); border-radius: 3px; padding: 3px 7px; align-self: flex-start;
}

/* --------------------------------------------------------------- queue -- */

.queue { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.queue-day { font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-faint); background: var(--panel-2); padding: 8px 15px; border-bottom: 1px solid var(--line); }
.queue-row { display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 12px 15px; background: var(--panel); border-bottom: 1px solid var(--line); }
.queue-row:last-child { border-bottom: 0; }
.queue-time { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.queue-name { font-size: 14px; font-weight: 500; cursor: pointer; }
.queue-name:hover { color: var(--signal); }
.queue-sub { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); margin-top: 2px; }
.chip-armed { font-family: var(--mono); font-size: 10px; letter-spacing: 0.11em; text-transform: uppercase; padding: 4px 8px; border-radius: 3px; white-space: nowrap; color: var(--signal); border: 1px solid var(--signal-deep); background: var(--signal-glow); }

.chip-row { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
.chip {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 6px 10px; border-radius: 3px; border: 1px solid var(--line);
  background: transparent; color: var(--ink-faint); cursor: pointer; transition: all .16s;
}
.chip:hover { border-color: var(--line-lit); color: var(--ink-dim); }
.chip[aria-pressed="true"] { border-color: var(--signal-deep); background: var(--signal-glow); color: var(--signal); }

dl.meta { margin: 14px 0 0; display: flex; flex-direction: column; gap: 12px; font-size: 13.5px; }
dl.meta > div { display: flex; justify-content: space-between; gap: 14px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
dl.meta dt { color: var(--ink-dim); }
dl.meta dd { margin: 0; font-family: var(--mono); font-size: 12.5px; }

/* --------------------------------------------------------------- taste -- */

.bar { height: 3px; width: 100%; background: var(--panel-3); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--signal); transition: width .3s; }

.scale { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.verdict {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  border-radius: 5px; border: 1px solid var(--line-lit); background: transparent;
  color: var(--ink); padding: 13px 8px; cursor: pointer; transition: all .16s;
  font-family: var(--body); font-size: 13px; font-weight: 500;
}
.verdict.v1 { border-color: rgba(255,179,64,0.45); background: var(--live-glow); color: var(--live); }
.verdict.v2 { color: var(--ink-dim); }
.verdict.v2:hover { border-color: rgba(255,179,64,0.45); color: var(--live); }
.verdict.v3:hover { border-color: var(--signal-deep); color: var(--signal); }
.verdict.v4 { border-color: var(--signal-deep); background: var(--signal-glow); color: var(--signal); }
.bars { display: flex; align-items: flex-end; gap: 3px; }
.bars i { width: 4px; border-radius: 1px; background: currentColor; }

.not-seen {
  margin-top: 12px; width: 100%; border: 1px dashed var(--line); background: transparent;
  color: var(--ink-faint); border-radius: 5px; padding: 12px; cursor: pointer;
  font-family: var(--body); font-size: 13px; transition: all .16s;
}
.not-seen:hover { border-color: var(--line-lit); color: var(--ink-dim); }
.not-seen small { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; opacity: .7; margin-left: 8px; }

.reason {
  display: inline-block; border: 1px solid var(--signal-deep); background: var(--signal-glow);
  color: var(--signal); border-radius: 3px; padding: 6px 10px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
}

/* --------------------------------------------------------------- sheet -- */

.backdrop {
  position: fixed; inset: 0; z-index: 50; display: flex; justify-content: center;
  align-items: flex-start; overflow-y: auto; background: rgba(5,7,13,0.8);
  backdrop-filter: blur(4px); padding: max(12px, var(--gutter));
}
.sheet {
  width: 100%; max-width: 860px; margin: 24px 0; border-radius: 8px;
  border: 1px solid var(--line-lit); background: var(--panel);
  box-shadow: 0 24px 80px rgba(0,0,0,0.65);
}
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); padding: 16px clamp(18px,3vw,28px); }
.sheet-close { background: transparent; border: 1px solid var(--line); color: var(--ink-faint); border-radius: var(--radius); padding: 6px 10px; cursor: pointer; font-family: var(--mono); font-size: 11px; }
.sheet-close:hover { border-color: var(--line-lit); color: var(--ink); }
.sheet-body { display: grid; gap: clamp(18px,3vw,28px); padding: clamp(18px,3vw,26px) clamp(18px,3vw,28px); grid-template-columns: 150px minmax(0,1fr); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.stat { background: var(--panel); padding: 11px 13px; }
.stat-val { font-family: var(--mono); font-size: 14px; font-weight: 600; margin-top: 4px; }
.stat-val.live { color: var(--live); }

.offer { display: flex; align-items: center; gap: 12px; padding: 10px 13px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel-2); margin-bottom: 8px; }
.offer-logo { width: 32px; height: 32px; border-radius: 3px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 11px; flex: none; }
.offer-name { font-size: 14px; font-weight: 500; flex: 1; min-width: 0; }
.offer-you { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--signal); border: 1px solid var(--signal-deep); background: var(--signal-glow); border-radius: 3px; padding: 3px 6px; white-space: nowrap; }
.offer-kind { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
.offer-kind.inc { color: var(--signal); }
.offer-kind.rent { color: var(--ink-faint); }

.rule { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
.rule:last-child { border-bottom: 0; }
.rule-name { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.rule-desc { color: var(--ink-dim); font-size: 12.5px; margin-top: 3px; line-height: 1.5; }
.rule-optin { font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; }

.sw { position: relative; width: 42px; height: 24px; border-radius: 12px; background: var(--panel-3); border: 1px solid var(--line-lit); cursor: pointer; flex: none; transition: all .18s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink-faint); transition: transform .18s, background .18s; }
.sw[aria-checked="true"] { background: var(--signal-glow); border-color: var(--signal-deep); }
.sw[aria-checked="true"]::after { transform: translateX(18px); background: var(--signal); }
.sw:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

.prose { color: var(--ink-dim); max-width: 62ch; font-size: 14.5px; }
.fine { font-size: 11.5px; color: var(--ink-faint); line-height: 1.55; }
.foot { border-top: 1px solid var(--line); margin-top: 60px; padding-top: 20px; color: var(--ink-faint); font-size: 12px; display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.hidden { display: none !important; }

:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; }
  .sheet-body { grid-template-columns: 1fr; }
  .sheet-art { max-width: 150px; margin-inline: auto; }
  nav.tabs { margin-left: 0; width: 100%; order: 3; }
}
@media (max-width: 520px) {
  .scale { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
</style>

<canvas id="stars" aria-hidden="true"></canvas>

<div class="shell">
  <header class="topbar">
    <div class="topbar-in">
      <div class="mark"><span class="mark-dot"></span>TV-Watcher</div>
      <span class="flag">Prototype · sample data</span>
      <nav class="tabs" role="tablist" aria-label="Pages">
        <button class="tab" role="tab" aria-selected="true"  data-page="discover">Discover</button>
        <button class="tab" role="tab" aria-selected="false" data-page="following">Following</button>
        <button class="tab" role="tab" aria-selected="false" data-page="taste">Find a film</button>
      </nav>
    </div>
  </header>

  <main>
    <section id="page-discover"></section>
    <section id="page-following" hidden></section>
    <section id="page-taste" hidden></section>
  </main>
</div>

<div id="sheet-root"></div>

<script>
(function () {
  "use strict";

  /* ==================================================================== art */
  /* Generated cover art, mirroring src/lib/poster.ts exactly: FNV-1a hash ->
     duotone ground + one of six motifs. Same title always yields the same
     plate, so a rail reads as composed rather than random. */

  function hash(s) {
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }

  /* ================================================================== taste */

  var FREE_LIMIT = 15, INTERVAL = 5;
  var taste = { started: false, counted: 0, deck: [], index: 0, prefs: {}, loved: [], shownSuggestion: null, dismissed: {} };

  /* Mirrors src/lib/taste.ts: three buckets — informative, aligned, wildcard.
     The wildcard is the point, not a concession: without it the model
     converges on its own first guess and never recovers. */
  function buildDeck() {
    var rated = {};
    taste.deck.slice(0, taste.index).forEach(function (t) { rated[t.name] = 1; });

    var pool = CATALOG.filter(function (t) {
      return t.kind === "Film" && t.year <= 2025 && !rated[t.name];
    });

    function reach(t) { return Math.log(t.pop + 10) / Math.LN10; }
    function affinity(t) {
      var known = t.genres.map(function (g) { return taste.prefs[g]; }).filter(function (w) { return w !== undefined; });
      if (!known.length) return 0;
      return known.reduce(function (a, b) { return a + b; }, 0) / known.length;
    }

    function sample(weights, n) {
      var p = weights.filter(function (w) { return w.weight > 0; }).slice(), out = [];
      while (out.length < n && p.length) {
        var total = p.reduce(function (s, i) { return s + i.weight; }, 0);
        var target = Math.random() * total, i = 0;
        for (; i < p.length - 1; i++) { target -= p[i].weight; if (target <= 0) break; }
        out.push(p[i].item); p.splice(i, 1);
      }
      return out;
    }

    var used = {}, chosen = [];
    function draw(weights, n) {
      sample(weights.filter(function (w) { return !used[w.item.name]; }), n).forEach(function (t) {
        if (used[t.name]) return; used[t.name] = 1; chosen.push(t);
      });
    }

    draw(pool.map(function (t) {
      var unknown = t.genres.filter(function (g) { return taste.prefs[g] === undefined; }).length;
      return { item: t, weight: (unknown * 2 + 0.4) * reach(t) };
    }), 9);

    draw(pool.map(function (t) {
      var a = affinity(t);
      return { item: t, weight: a > 0 ? (a + 0.05) * 6 * reach(t) : 0 };
    }), 5);

    draw(pool.map(function (t) {
      var a = affinity(t);
      return { item: t, weight: reach(t) * (a < 0 ? 0.35 : 1) };
    }), 4);

    return chosen.sort(function () { return Math.random() - 0.5; });
  }

  var WEIGHTS = { LOVED: 2, LIKED: 1, DISLIKED: -1.2, HATED: -2.5 };

  function record(title, verdict) {
    if (verdict === "NOT_SEEN") return;
    taste.counted++;
    if (verdict === "LOVED") taste.loved.push(title);
    var w = WEIGHTS[verdict];
    title.genres.forEach(function (g) {
      var cur = taste.prefs[g] || 0;
      taste.prefs[g] = Math.max(-1, Math.min(1, cur + w * 0.18));
    });
  }

  function suggest() {
    var rated = {}, i;
    for (i = 0; i < taste.index; i++) rated[taste.deck[i].name] = 1;
    var best = null, bestScore = -Infinity;
    CATALOG.forEach(function (t) {
      if (t.kind !== "Film" || rated[t.name] || taste.dismissed[t.name] || t.year > 2025) return;
      var known = t.genres.map(function (g) { return taste.prefs[g]; }).filter(function (w) { return w !== undefined; });
      var score = known.length ? known.reduce(function (a, b) { return a + b; }, 0) / known.length : 0;
      score += (t.pop / 2000);
      if (score > bestScore) { bestScore = score; best = t; }
    });
    if (!best) return null;

    var top = null, topW = -Infinity;
    best.genres.forEach(function (g) {
      var w = taste.prefs[g] || 0;
      if (w > topW) { topW = w; top = g; }
    });
    var witness = null;
    for (i = 0; i < taste.loved.length; i++) {
      if (taste.loved[i].genres.indexOf(top) >= 0) { witness = taste.loved[i]; break; }
    }
    return {
      title: best,
      reason: topW > 0.12 ? (witness ? top + " — like " + witness.name : "Strong " + top.toLowerCase() + " match")
                          : "Well reviewed and close to your picks"
    };
  }

  /* ============================================================== countdown */

  function tick() {
    var ms = Math.max(0, TARGET - new Date());
    var s = Math.floor(ms / 1000);
    var set = function (id, v) { var n = document.getElementById(id); if (n) n.textContent = v; };
    set("c-d", pad(Math.floor(s / 86400)));
    set("c-h", pad(Math.floor((s % 86400) / 3600)));
    set("c-m", pad(Math.floor((s % 3600) / 60)));
    set("c-s", pad(s % 60));
  }

  /* ============================================================== starfield */
  /* Stars carry a depth z in (0,1]. Projecting by x/z pushes them outward as
     depth shrinks, which reads as travelling forward rather than drifting. */

  (function () {
    var canvas = document.getElementById("stars");
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    if (!ctx) return;

    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var SPEED = 0.041;
    var stars = [], w = 0, h = 0, last = performance.now();

    function spawn(s, depth) {
      s.x = (Math.random() * 2 - 1) * 1.5;
      s.y = (Math.random() * 2 - 1) * 1.5;
      s.z = depth === undefined ? 1 : depth;
      s.tint = Math.random();
    }

    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + "px"; canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var target = Math.min(520, Math.round((w * h) / 3200));
      stars = [];
      for (var i = 0; i < target; i++) { var s = { x: 0, y: 0, z: 1, tint: 0 }; spawn(s, Math.random()); stars.push(s); }
    }

    function draw(dt) {
      var cx = w / 2, cy = h / 2, scale = Math.min(w, h) * 0.5;
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        if (!reduce) { s.z -= SPEED * dt; if (s.z <= 0.02) { spawn(s); continue; } }
        var px = cx + (s.x / s.z) * scale, py = cy + (s.y / s.z) * scale;
        if (px < -40 || px > w + 40 || py < -40 || py > h + 40) { if (!reduce) spawn(s); continue; }
        var near = 1 - s.z;
        var r = 0.4 + near * near * 1.7;
        var a = Math.min(0.7, 0.1 + near * near * 0.8);
        ctx.fillStyle = s.tint > 0.82 ? "rgba(69,224,208," + a + ")" : "rgba(222,236,255," + a + ")";
        ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
      }
    }

    function frame(now) {
      var dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      draw(dt);
      requestAnimationFrame(frame);
    }

    resize();
    window.addEventListener("resize", resize);
    if (reduce) draw(0); else requestAnimationFrame(frame);
  })();

  /* =================================================================== boot */

  renderDiscover();
  renderFollowing();
  tick();
  setInterval(tick, 1000);
})();
</script>
